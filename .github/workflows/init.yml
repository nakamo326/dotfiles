name: check install script
on:
  push:
    branches: [master]

jobs:
  run-install-sh:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: /bin/bash install.sh
      - run: /bin/bash macos.sh
        if: runner.os == 'macOS'
